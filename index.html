["Se tocchi terra durante un colpo aereo resti fermo un attimo (lag): colpisci in discesa e finisci prima di atterrare.","If you touch the ground during an aerial attack you freeze for a moment (landing lag): hit on the way down and finish before landing.","Si tocas el suelo durante un golpe aéreo te quedas quieto un instante (lag): golpea al descender y termina antes de aterrizar.","Si tu touches le sol pendant un coup aérien, tu restes figé un instant (lag) : frappe en descendant et termine avant d'atterrir."],
["Avvicinati al dummy e premi {} per afferrarlo. Poi scegli il lancio: {} o {} avanti e dietro (rispetto a dove guardi), {} su, {} giù. Se il dummy è lontano premi Tab.","Get close to the dummy and press {} to grab it. Then choose the throw: {} or {} forward and back (relative to where you face), {} up, {} down. If the dummy is far away, press Tab.","Acércate al muñeco y pulsa {} para agarrarlo. Luego elige el lanzamiento: {} o {} hacia delante y hacia atrás (según hacia dónde mires), {} arriba, {} abajo. Si el muñeco está lejos, pulsa Tab.","Approche-toi du mannequin et appuie sur {} pour l'attraper. Puis choisis la projection : {} ou {} avant et arrière (selon ta direction), {} haut, {} bas. Si le mannequin est loin, appuie sur Tab."],
["Cadendo vicino agli angoli del palco ti aggrappi al bordo (puoi evitarlo tenendo giù). Per circa #,# secondi sei invulnerabile. Poi scegli: verso il palco per risalire, su per saltare, colpo per risalire attaccando, scudo per risalire rotolando, giù o indietro per lasciarti cadere. Dopo # secondi cadi da solo.","When you fall near the corners of the stage you grab the ledge (you can avoid it by holding down). For about #.# seconds you are invulnerable. Then choose: toward the stage to climb up, up to jump, attack to climb up attacking, shield to climb up rolling, down or back to let yourself drop. After # seconds you drop on your own.","Al caer cerca de las esquinas del escenario te agarras al borde (puedes evitarlo manteniendo abajo). Durante unos #,# segundos eres invulnerable. Luego elige: hacia el escenario para subir, arriba para saltar, golpe para subir atacando, escudo para subir rodando, abajo o atrás para dejarte caer. Pasados # segundos caes solo.","En tombant près des coins de l'arène, tu t'accroches au rebord (tu peux l'éviter en maintenant bas). Pendant environ #,# s tu es invulnérable. Puis choisis : vers l'arène pour remonter, haut pour sauter, coup pour remonter en attaquant, bouclier pour remonter en roulant, bas ou arrière pour te laisser tomber. Au bout de # secondes, tu tombes tout seul."],
["Cadi accanto al bordo del palco: ti aggrappi da solo. Poi scegli: verso il palco per risalire, {} per saltare, {} per risalire attaccando, {} per risalire rotolando.","Fall next to the edge of the stage: you grab on automatically. Then choose: toward the stage to climb up, {} to jump, {} to climb up attacking, {} to climb up rolling.","Cae junto al borde del escenario: te agarras solo. Luego elige: hacia el escenario para subir, {} para saltar, {} para subir atacando, {} para subir rodando.","Tombe à côté du rebord de l'arène : tu t'accroches tout seul. Puis choisis : vers l'arène pour remonter, {} pour sauter, {} pour remonter en attaquant, {} pour remonter en roulant."],
["Colpi dati e subiti (e il tempo) caricano la barra SUPER. Quando è piena premi il tasto Super: parte un attacco con un'area gialla ben visibile. Se colpisce l'avversario, anche se si para, parte la cinematica unica del personaggio con danni e lancio enormi. Se lo manchi va a vuoto e la barra è persa.","Hits dealt and taken (and time) charge the SUPER bar. When it's full, press the Super key: an attack starts with a clearly visible yellow area. If it hits the opponent, even if they're shielding, the character's unique cinematic plays with huge damage and launch. If you miss, it whiffs and the bar is lost.","Los golpes dados y recibidos (y el tiempo) cargan la barra SUPER. Cuando está llena, pulsa la tecla Super: sale un ataque con un área amarilla bien visible. Si alcanza al rival, aunque se cubra, se activa la cinemática única del personaje con daño y lanzamiento enormes. Si fallas, se queda en vacío y se pierde la barra.","Les coups donnés et reçus (et le temps) chargent la barre SUPER. Quand elle est pleine, appuie sur la touche Super : une attaque part avec une zone jaune bien visible. Si elle touche l'adversaire, même s'il se protège, la cinématique unique du personnage se déclenche, avec des dégâts et une projection énormes. Si tu rates, elle part dans le vide et la barre est perdue."],
["Esc o P mettono in pausa e M spegne l'audio. Con il gamepad: stick o croce per muoverti, A colpo, B speciale, X o Y salto, LB o LT scudo, RB presa, RT Super (Select tenuto premuto = pausa). Nel menu trovi Opzioni (volumi, vite, danni) e Comandi (cambia tutti i tasti). L'Allenamento ha pausa, hitbox e dati dei colpi. Premi Invio.","Esc or P pause the game and M mutes the audio. With a gamepad: stick or D-pad to move, A attack, B special, X or Y jump, LB or LT shield, RB grab, RT Super (hold Select = pause). In the menu you'll find Options (volumes, stocks, damage) and Controls (change all keys). Training has pause, hitboxes and hit data. Press Enter.","Esc o P pausan la partida y M silencia el audio. Con mando: stick o cruceta para moverte, A golpe, B especial, X o Y salto, LB o LT escudo, RB agarre, RT Super (Select mantenido = pausa). En el menú encontrarás Opciones (volúmenes, vidas, daño) y Controles (cambia todas las teclas). El Entrenamiento tiene pausa, hitbox y datos de los golpes. Pulsa Intro.","Esc ou P mettent en pause et M coupe le son. Avec une manette : stick ou croix directionnelle pour te déplacer, A coup, B spécial, X ou Y saut, LB ou LT bouclier, RB saisie, RT Super (Select maintenu = pause). Dans le menu tu trouves Options (volumes, vies, dégâts) et Commandes (change toutes les touches). L'Entraînement a pause, hitbox et données des coups. Appuie sur Entrée."],
["Esc o P mettono in pausa (dal menu di pausa riprendi, ricomincia o esci); nei menu Esc torna indietro. M spegne e riaccende l'audio. Dal menu principale: Opzioni per volumi, vite, danni, forza dei lanci e difficoltà; Comandi per cambiare tutti i tasti di P#, P# e allenamento. L'Allenamento offre pausa, passo a frame, hitbox e dati dei colpi.","Esc or P pause the game (from the pause menu you can resume, restart or quit); in menus Esc goes back. M mutes and unmutes the audio. From the main menu: Options for volumes, stocks, damage, throw strength and difficulty; Controls to change all the keys of P#, P# and training. Training offers pause, frame step, hitboxes and hit data.","Esc o P pausan la partida (desde el menú de pausa puedes reanudar, reiniciar o salir); en los menús Esc vuelve atrás. M silencia y reactiva el audio. Desde el menú principal: Opciones para volúmenes, vidas, daño, fuerza de los lanzamientos y dificultad; Controles para cambiar todas las teclas de P#, P# y entrenamiento. El Entrenamiento ofrece pausa, avance fotograma a fotograma, hitbox y datos de los golpes.","Esc ou P mettent en pause (depuis le menu de pause tu peux reprendre, recommencer ou quitter) ; dans les menus Esc revient en arrière. M coupe et rétablit le son. Depuis le menu principal : Options pour les volumes, les vies, les dégâts, la force des projections et la difficulté ; Commandes pour changer toutes les touches de P#, P# et de l'entraînement. L'Entraînement offre pause, avance image par image, hitbox et données des coups."],
["Il percorso completo ti guida in # lezioni, dalle basi (movimento e salto) alle tecniche avanzate (prese, bordo del palco, recupero). Ogni lezione spiega il comando e te lo fa provare su un dummy: le azioni richieste si spuntano da sole.","The full course guides you through # lessons, from the basics (movement and jumping) to advanced techniques (grabs, stage ledge, recovery). Each lesson explains the control and lets you try it on a dummy: the required actions tick off by themselves.","El recorrido completo te guía por # lecciones, desde lo básico (movimiento y salto) hasta las técnicas avanzadas (agarres, borde del escenario, recuperación). Cada lección explica el control y te lo hace probar con un muñeco: las acciones requeridas se marcan solas.","Le parcours complet te guide à travers # leçons, des bases (déplacement et saut) aux techniques avancées (saisies, rebord de l'arène, récupération). Chaque leçon explique la commande et te la fait essayer sur un mannequin : les actions demandées se cochent toutes seules."],
["Il tasto colpo ha quattro varianti. Neutro: veloce e debole, ottimo per iniziare i combo. Laterale (tieni sinistra o destra): più forte, lancia più lontano. In alto (tieni su): colpisce sopra la testa, ottimo contro chi salta. In basso (tieni giù): spazza il terreno vicino a te.","The attack key has four variants. Neutral: fast and weak, great for starting combos. Side (hold left or right): stronger, launches farther. Up (hold up): hits above your head, great against jumpers. Down (hold down): sweeps the ground near you.","El botón de golpe tiene cuatro variantes. Neutro: rápido y débil, ideal para iniciar combos. Lateral (mantén izquierda o derecha): más fuerte, lanza más lejos. Arriba (mantén arriba): golpea sobre tu cabeza, ideal contra quien salta. Abajo (mantén abajo): barre el suelo cercano.","La touche de coup a quatre variantes. Neutre : rapide et faible, parfait pour lancer des combos. Latéral (maintiens gauche ou droite) : plus fort, envoie plus loin. Haut (maintiens haut) : frappe au-dessus de ta tête, idéal contre ceux qui sautent. Bas (maintiens bas) : balaie le sol près de toi."],
["In aria il colpo cambia. Da solo: colpo rotante che colpisce tutto intorno. Verso dove guardi: colpo in avanti. Dalla parte opposta: colpo dietro le spalle (di solito il più forte). Con su: colpo verso l'alto. Con giù: picchiata, che manda il nemico verso il basso (se è a terra rimbalza).","In the air the attack changes. Alone: a spinning hit that strikes all around. Toward where you face: forward attack. The opposite way: back attack behind you (usually the strongest). With up: up attack. With down: dive, which sends the enemy downward (if grounded they bounce).","En el aire el golpe cambia. Solo: golpe giratorio que golpea alrededor. Hacia donde miras: golpe hacia delante. Hacia el lado opuesto: golpe a la espalda (normalmente el más fuerte). Con arriba: golpe hacia arriba. Con abajo: picado, que manda al enemigo hacia abajo (si está en el suelo, rebota).","En l'air, le coup change. Seul : coup tournoyant qui frappe tout autour. Vers où tu regardes : coup avant. Du côté opposé : coup dans le dos (en général le plus fort). Avec haut : coup vers le haut. Avec bas : plongée, qui envoie l'ennemi vers le bas (s'il est au sol, il rebondit)."],
["La barra SUPER sotto al personaggio si carica colpendo e subendo colpi (qui è già piena). Premi {} davanti al dummy: parte un attacco speciale. Se lo colpisci parte la cinematica con danni e lancio enormi, se lo manchi va a vuoto. Tab ricarica la barra.","The SUPER bar under the character charges by hitting and getting hit (here it's already full). Press {} in front of the dummy: a special attack starts. If it connects, the cinematic plays with huge damage and launch; if you miss, it whiffs. Tab recharges the bar.","La barra SUPER bajo el personaje se carga golpeando y recibiendo golpes (aquí ya está llena). Pulsa {} delante del muñeco: sale un ataque especial. Si lo alcanzas, se activa la cinemática con daño y lanzamiento enormes; si fallas, se queda en vacío. Tab recarga la barra.","La barre SUPER sous le personnage se charge en frappant et en encaissant des coups (ici elle est déjà pleine). Appuie sur {} devant le mannequin : une attaque spéciale part. Si tu le touches, la cinématique se déclenche avec des dégâts et une projection énormes ; si tu rates, elle part dans le vide. Tab recharge la barre."],
["La percentuale sotto al personaggio mostra il danno subito: più è alta, più i colpi lo lanciano lontano. Se esci dallo schermo (sopra, sotto o di lato) perdi una vita e rientri dall'alto. Vince chi resta con vite. In allenamento le vite sono infinite.","The percentage under the character shows the damage taken: the higher it is, the farther hits launch them. If you leave the screen (above, below or sideways) you lose a stock and re-enter from above. The one who still has stocks wins. In training stocks are infinite.","El porcentaje bajo el personaje muestra el daño recibido: cuanto más alto, más lejos lo lanzan los golpes. Si sales de la pantalla (por arriba, abajo o un lado) pierdes una vida y vuelves a entrar desde arriba. Gana quien conserva vidas. En entrenamiento las vidas son infinitas.","Le pourcentage sous le personnage indique les dégâts subis : plus il est élevé, plus les coups l'envoient loin. Si tu sors de l'écran (par le haut, le bas ou un côté), tu perds une vie et tu reviens par le haut. Gagne celui qui garde des vies. À l'entraînement, les vies sont infinies."],
["La presa (a terra) afferra il nemico anche se si sta parando. Una volta afferrato puoi colpirlo (tasto colpo) per piccoli danni, oppure lanciarlo con una direzione: avanti, dietro, su (verticale) o giù (molto danno, poco lancio). Se non scegli, dopo un po' lo lasci. Lui può liberarsi premendo tasti a raffica.","The grab (on the ground) catches the enemy even if they're shielding. Once grabbed you can hit them (attack key) for small damage, or throw them in a direction: forward, back, up (vertical) or down (lots of damage, little launch). If you don't choose, after a while you let go. They can break free by mashing buttons.","El agarre (en el suelo) atrapa al enemigo aunque se esté cubriendo. Una vez agarrado puedes golpearlo (botón de golpe) para causar poco daño, o lanzarlo en una dirección: hacia delante, atrás, arriba (vertical) o abajo (mucho daño, poco lanzamiento). Si no eliges, pasado un rato lo sueltas. Él puede liberarse pulsando botones sin parar.","La saisie (au sol) attrape l'ennemi même s'il se protège. Une fois attrapé, tu peux le frapper (touche de coup) pour de petits dégâts, ou le projeter dans une direction : avant, arrière, haut (vertical) ou bas (beaucoup de dégâts, peu d'éjection). Si tu ne choisis pas, tu le relâches au bout d'un moment. Il peut se libérer en martelant les touches."],
["Le due piattaforme sopra il palco si attraversano dal basso saltando. Per scendere da una piattaforma premi giù mentre ci stai sopra. In aria, tenendo premuto giù cadi molto più in fretta (caduta veloce): serve a evitare un attacco o a piombare sul nemico.","The two platforms above the stage can be passed through from below by jumping. To drop down from a platform, press down while standing on it. In the air, holding down makes you fall much faster (fast fall): useful to avoid an attack or to drop onto the enemy.","Las dos plataformas sobre el escenario se atraviesan desde abajo saltando. Para bajar de una plataforma, pulsa abajo mientras estás encima. En el aire, manteniendo abajo caes mucho más rápido (caída rápida): sirve para evitar un ataque o para caer sobre el enemigo.","Les deux plateformes au-dessus de l'arène se traversent par en dessous en sautant. Pour descendre d'une plateforme, appuie sur bas tant que tu es dessus. En l'air, maintenir bas te fait tomber bien plus vite (chute rapide) : utile pour éviter une attaque ou piquer sur l'ennemi."],
["Ogni personaggio ha quattro speciali scelti dalla direzione: neutro, laterale, su e giù. In aria alcune versioni cambiano. Lo speciale verso l'alto serve anche a tornare sul palco e si può usare una sola volta in aria, finché non atterri o vieni colpito. Dopo ogni speciale c'è un tempo di ricarica.","Every character has four specials chosen by direction: neutral, side, up and down. In the air some versions change. The up special also helps you return to the stage and can only be used once in the air until you land or get hit. After each special there is a cooldown.","Cada personaje tiene cuatro especiales que se eligen con la dirección: neutro, lateral, arriba y abajo. En el aire algunas versiones cambian. El especial hacia arriba también sirve para volver al escenario y solo se puede usar una vez en el aire, hasta que aterrices o te golpeen. Tras cada especial hay un tiempo de recarga.","Chaque personnage a quatre spéciaux choisis par la direction : neutre, latéral, haut et bas. En l'air, certaines versions changent. Le spécial vers le haut sert aussi à revenir sur l'arène et ne peut être utilisé qu'une fois en l'air, jusqu'à l'atterrissage ou jusqu'à ce que tu sois touché. Après chaque spécial, il y a un temps de recharge."],
["Premi su per saltare. Mentre sei in aria premilo ancora per il doppio salto (Nebula ne ha due in aria, gli altri uno). I salti si ricaricano quando atterri o ti aggrappi al bordo del palco. Tenere premuto non salta più volte: devi ripremere.","Press up to jump. While in the air press it again for the double jump (Nebula has two in the air, the others one). Jumps recharge when you land or grab the stage ledge. Holding doesn't jump repeatedly: you must press again.","Pulsa arriba para saltar. Estando en el aire púlsalo otra vez para el doble salto (Nebula tiene dos en el aire, los demás uno). Los saltos se recargan al aterrizar o al agarrarte al borde del escenario. Mantener pulsado no salta varias veces: debes volver a pulsar.","Appuie sur haut pour sauter. En l'air, appuie à nouveau pour le double saut (Nebula en a deux en l'air, les autres un). Les sauts se rechargent quand tu atterris ou t'accroches au rebord de l'arène. Maintenir la touche ne fait pas sauter plusieurs fois : il faut réappuyer."],
["Premi {} per lo speciale. La direzione cambia la mossa: nessuna, {}/{} laterale, {} su, {} giù. Ogni personaggio ha mosse diverse!","Press {} for the special. The direction changes the move: none, {}/{} side, {} up, {} down. Every character has different moves!","Pulsa {} para el especial. La dirección cambia el movimiento: ninguna, {}/{} lateral, {} arriba, {} abajo. ¡Cada personaje tiene movimientos distintos!","Appuie sur {} pour le spécial. La direction change l'attaque : aucune, {}/{} latéral, {} haut, {} bas. Chaque personnage a des attaques différentes !"],
["Questo tutorial ti insegna tutti i comandi, un passo alla volta. Fai l'azione richiesta e verrà spuntata da sola. Puoi usare anche i tasti di P#. Premi Invio per iniziare.","This tutorial teaches you every control, one step at a time. Do the requested action and it will tick off by itself. You can also use P#'s keys. Press Enter to begin.","Este tutorial te enseña todos los controles, paso a paso. Haz la acción pedida y se marcará sola. También puedes usar las teclas de P#. Pulsa Intro para empezar.","Ce tutoriel t'apprend toutes les commandes, une étape à la fois. Fais l'action demandée et elle se cochera toute seule. Tu peux aussi utiliser les touches de P#. Appuie sur Entrée pour commencer."],
["Salta e colpisci con {}: da solo per il colpo rotante, verso dove guardi per l'avanti, dalla parte opposta per il colpo dietro, con {} verso l'alto e con {} per la picchiata.","Jump and attack with {}: alone for the spinning hit, toward where you face for the forward attack, the opposite way for the back attack, with {} for the up attack and with {} for the dive.","Salta y golpea con {}: solo para el golpe giratorio, hacia donde miras para el golpe hacia delante, hacia el lado contrario para el golpe a la espalda, con {} hacia arriba y con {} para el picado.","Saute et frappe avec {} : seul pour le coup tournoyant, vers où tu regardes pour le coup avant, du côté opposé pour le coup dans le dos, avec {} pour le coup haut et avec {} pour la plongée."],
["Scudo + sinistra o destra: rotolata, ti sposta restando invulnerabile per un attimo. Scudo + giù: schivata sul posto. In aria premi scudo: schivata aerea (sposta nella direzione tenuta), una sola volta finché non tocchi terra. Dopo ogni schivata c'è una breve pausa in cui non puoi schivare di nuovo.","Shield + left or right: roll, moving you while staying invulnerable for a moment. Shield + down: spot dodge. In the air press shield: air dodge (moves in the held direction), only once until you touch the ground. After every dodge there is a brief pause in which you can't dodge again.","Escudo + izquierda o derecha: rodar, te desplaza siendo invulnerable un instante. Escudo + abajo: esquiva en el sitio. En el aire pulsa escudo: esquiva aérea (te mueve en la dirección mantenida), solo una vez hasta que toques el suelo. Tras cada esquiva hay una breve pausa en la que no puedes volver a esquivar.","Bouclier + gauche ou droite : roulade, te déplace en restant invulnérable un instant. Bouclier + bas : esquive sur place. En l'air, appuie sur bouclier : esquive aérienne (déplace dans la direction maintenue), une seule fois jusqu'à ce que tu touches le sol. Après chaque esquive, il y a une courte pause pendant laquelle tu ne peux pas esquiver à nouveau."],
["Scudo + {} o {} = rotolata. Scudo + {} = schivata sul posto. In aria premi {} per la schivata aerea (una sola volta finché non atterri).","Shield + {} or {} = roll. Shield + {} = spot dodge. In the air press {} for the air dodge (only once until you land).","Escudo + {} o {} = rodar. Escudo + {} = esquiva en el sitio. En el aire pulsa {} para la esquiva aérea (solo una vez hasta aterrizar).","Bouclier + {} ou {} = roulade. Bouclier + {} = esquive sur place. En l'air, appuie sur {} pour l'esquive aérienne (une seule fois jusqu'à l'atterrissage)."],
["Se finisci sotto il palco usa lo speciale verso l'alto (ogni personaggio ha una salita o un teletrasporto) e i doppi salti. La parte inferiore del palco è a cono: se la urti salendo scivoli verso il bordo e ti aggrappi da solo. Ricorda di muoverti verso il palco.","If you end up below the stage use the up special (every character has a climb or a teleport) and your double jumps. The underside of the stage is cone-shaped: if you hit it while rising you slide toward the edge and grab on automatically. Remember to move toward the stage.","Si acabas bajo el escenario, usa el especial hacia arriba (cada personaje tiene un ascenso o un teletransporte) y los dobles saltos. La parte inferior del escenario es cónica: si la golpeas al subir, te deslizas hacia el borde y te agarras solo. Recuerda moverte hacia el escenario.","Si tu te retrouves sous l'arène, utilise le spécial vers le haut (chaque personnage a une montée ou une téléportation) et tes doubles sauts. Le dessous de l'arène est en cône : si tu le heurtes en montant, tu glisses vers le rebord et tu t'accroches tout seul. N'oublie pas de te diriger vers l'arène."],
["Sei finito sotto il palco! Usa lo speciale verso l'alto ({} + {}) e muoviti con {} per tornare in cima. Se ti aggrappi al bordo, premi verso il palco per risalire.","You ended up below the stage! Use the up special ({} + {}) and move with {} to get back on top. If you grab the ledge, press toward the stage to climb up.","¡Has acabado bajo el escenario! Usa el especial hacia arriba ({} + {}) y muévete con {} para volver arriba. Si te agarras al borde, pulsa hacia el escenario para subir.","Tu es passé sous l'arène ! Utilise le spécial vers le haut ({} + {}) et déplace-toi avec {} pour revenir au sommet. Si tu t'accroches au rebord, appuie vers l'arène pour remonter."],
["Sei su una piattaforma: premi {} per scendere attraverso di essa. In aria tieni premuto {} mentre cadi per cadere più in fretta.","You're on a platform: press {} to drop through it. In the air hold {} while falling to fall faster.","Estás en una plataforma: pulsa {} para bajar atravesándola. En el aire mantén {} mientras caes para caer más rápido.","Tu es sur une plateforme : appuie sur {} pour la traverser vers le bas. En l'air, maintiens {} pendant la chute pour tomber plus vite."],
["Sinistra e destra muovono il personaggio. A terra si gira verso la direzione in cui vai. In aria resta rivolto dove guardava prima del salto: così puoi colpire anche all'indietro senza girarti. Dopo un colpo subito non controlli più il movimento finché non finisce lo stordimento.","Left and right move the character. On the ground it turns toward the direction you go. In the air it keeps facing where it looked before the jump: this way you can hit backward without turning. After taking a hit you lose control of movement until the stun ends.","Izquierda y derecha mueven al personaje. En el suelo se gira hacia la dirección en la que vas. En el aire sigue mirando hacia donde miraba antes del salto: así puedes golpear hacia atrás sin girarte. Tras recibir un golpe pierdes el control del movimiento hasta que termina el aturdimiento.","Gauche et droite déplacent le personnage. Au sol, il se tourne dans la direction où tu vas. En l'air, il reste tourné là où il regardait avant le saut : tu peux ainsi frapper vers l'arrière sans te retourner. Après avoir encaissé un coup, tu perds le contrôle du mouvement jusqu'à la fin de l'étourdissement."],
["Tieni premuto lo scudo a terra per bloccare i colpi senza subire danni. L'energia (la barretta sopra il personaggio) si consuma mentre lo tieni e quando para: se finisce, lo scudo si rompe e resti stordito a lungo. Lo scudo si ricarica piano quando lo abbassi.","Hold the shield on the ground to block hits without taking damage. The energy (the small bar above the character) drains while you hold it and when it blocks: if it runs out, the shield breaks and you're stunned for a long time. The shield recharges slowly when you lower it.","Mantén el escudo en el suelo para bloquear golpes sin recibir daño. La energía (la barrita sobre el personaje) se gasta mientras lo mantienes y cuando bloquea: si se acaba, el escudo se rompe y quedas aturdido mucho tiempo. El escudo se recarga despacio cuando lo bajas.","Maintiens le bouclier au sol pour bloquer les coups sans subir de dégâts. L'énergie (la petite barre au-dessus du personnage) se consomme pendant que tu le maintiens et quand il pare : si elle s'épuise, le bouclier se brise et tu restes étourdi longtemps. Le bouclier se recharge lentement quand tu le baisses."],

["Il colpo laterale ti gira verso la direzione tenuta.","The side attack turns you toward the direction you hold.","El golpe lateral te gira hacia la dirección mantenida.","Le coup latéral te tourne vers la direction maintenue."],
["La schivata aerea è utile anche per tornare sul palco.","The air dodge is also useful for returning to the stage.","La esquiva aérea también es útil para volver al escenario.","L'esquive aérienne est aussi utile pour revenir sur l'arène."],
["Non tenere lo scudo sempre alzato: l'energia è limitata.","Don't keep your shield up all the time: the energy is limited.","No mantengas el escudo siempre alzado: la energía es limitada.","Ne garde pas le bouclier toujours levé : l'énergie est limitée."],
["Se il bordo è occupato dal nemico non puoi prenderlo.","If the enemy occupies the ledge you can't grab it.","Si el enemigo ocupa el borde, no puedes agarrarte.","Si l'ennemi occupe le rebord, tu ne peux pas t'y accrocher."],

  if(state==='csel'&&cph===2){[[340,1,0],[620,-1,1]].forEach(q=>drawF({x:q[0],y:380,face:q[1],fa:q[1],ch:(cosEff()[q[2]]?ALTCH:CH)[sel[q[2]]],alt:cosEff()[q[2]],ci:sel[q[2]],stun:0,inv:0,dead:0,atk:null,vx:0,gr:true,sq:Math.sin(fr*.08+q[2])*.03}))}
  if(state==='play'||state==='over'){
    for(const p of P)drawP(p);MN.forEach(drawMN);
    if(state==='play'){drawFX();F.forEach(drawF);drawPT();if(intro>0)introWorld();if(mode===3)drawBoxes()}
  }
  X.restore();
  if(flash>0){X.fillStyle='rgba(255,255,255,'+(flash/7*.5).toFixed(2)+')';X.fillRect(0,0,W,H)}
  if(muted)T('audio spento (M)',W-14,24,N(13),'#8a82b8','right');
  if(state==='menu')menu();
  else if(state==='csel')cselUI();
  else if(state==='tutm')tutmUI();
  else if(state==='onl')onlUI();
  else if(state==='onlr')lobUI();
  else if(state==='keys')keysUI();
  else if(state==='opts')optsUI();
  else if(state==='cld')cldUI();
  else if(state==='clr')clrUI();
  else if(state==='clc')clcUI();
  else if(state==='cle')cleUI();
  else{hud();if(CL.on&&state==='play')clHudInfo();
    if(mode===3&&state==='play'){if(tut.on)drawTut();else trainHUD()}
    if(state==='play'&&(intro>0||goT>0))drawCountdown();
    if(state==='play'&&fs.on)drawFS();
    if(NET.m)netHud();
    if(over>0)T('K.O.!',W/2,230,B(90),'#ffd23f');
    if(state==='over'){
      drawVictory();drawFX();drawPT();
    }
  }
  if(PM.on&&state==='play')pauseUI();
}
let last=0,acc=0;
let errN=0,errMsg='',errT=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(100,t-last);last=t;
  try{while(acc>=16.67){update();acc-=16.67}IA=acc/16.67;draw()}
  catch(e){console.error(e);errMsg=String(e&&e.message||e);errT=300;acc=0;if(++errN>2){errN=0;state='menu';tut.on=false;paused=false;try{demoStart()}catch(e2){}}}
  if(errT>0){errT--;try{X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;T('errore: '+errMsg,10,H-10,N(12),'#ff8a8a','left')}catch(e){}}}
demoStart();requestAnimationFrame(loop);
</script>
